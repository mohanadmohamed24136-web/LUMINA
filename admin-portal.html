<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal | LUMINA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="assets/css/style.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { primary: { cyan: "#00F0FF", magenta: "#FF00AA", gold: "#FFD700" }, dark: { bg: "#050505", card: "rgba(20, 20, 20, 0.7)", border: "rgba(255, 255, 255, 0.1)" } } } }
        }
    </script>
</head>
<body class="dark bg-dark-bg text-white">
    <div class="bg-mesh"></div>
    <nav class="fixed top-0 left-0 right-0 z-50 glass border-b border-white/5 backdrop-blur-xl">
        <div class="container mx-auto px-6 h-20 flex items-center justify-between">
            <a href="index.html" class="text-2xl font-black bg-gradient-to-r from-primary-cyan via-primary-magenta to-primary-gold bg-clip-text text-transparent tracking-tighter uppercase">LUMINA ADMIN</a>
            <button onclick="logout()" class="text-xs font-black uppercase tracking-widest text-red-400 hover:text-red-300 transition-colors">Logout</button>
        </div>
    </nav>

    <main class="container mx-auto px-6 pt-32 pb-20">
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
            <aside class="space-y-4">
                <button onclick="showAdminTab('overview')" class="w-full text-left px-6 py-4 glass rounded-2xl border border-white/5 hover:border-primary-cyan transition-all text-xs font-black uppercase tracking-widest">Overview</button>
                <button onclick="showAdminTab('products')" class="w-full text-left px-6 py-4 glass rounded-2xl border border-white/5 hover:border-primary-cyan transition-all text-xs font-black uppercase tracking-widest">Product Approvals</button>
            </aside>
            <div class="lg:col-span-3">
                <div id="admin-tab-overview" class="space-y-8">
                    <h1 class="text-4xl font-black tracking-tighter uppercase">System <span class="text-primary-cyan">Overview</span></h1>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div class="glass p-8 rounded-3xl border border-white/5">
                            <p class="text-[10px] font-black uppercase tracking-widest text-gray-500 mb-2">Total Users</p>
                            <p id="stat-users" class="text-3xl font-black">...</p>
                        </div>
                        <div class="glass p-8 rounded-3xl border border-white/5">
                            <p class="text-[10px] font-black uppercase tracking-widest text-gray-500 mb-2">Total Products</p>
                            <p id="stat-products" class="text-3xl font-black">...</p>
                        </div>
                        <div class="glass p-8 rounded-3xl border border-white/5">
                            <p class="text-[10px] font-black uppercase tracking-widest text-gray-500 mb-2">Pending Approvals</p>
                            <p id="stat-pending" class="text-3xl font-black text-yellow-400">...</p>
                        </div>
                    </div>
                </div>
                <div id="admin-tab-products" class="hidden space-y-8">
                    <h1 class="text-4xl font-black tracking-tighter uppercase">Product <span class="text-primary-gold">Approvals</span></h1>
                    <div id="pending-products-list" class="space-y-4">
                        <!-- Pending products injected here -->
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
    <script>
        async function showAdminTab(tab) {
            document.getElementById('admin-tab-overview').classList.add('hidden');
            document.getElementById('admin-tab-products').classList.add('hidden');
            document.getElementById(`admin-tab-${tab}`).classList.remove('hidden');
            if (tab === 'products') loadPendingProducts();
        }

        async function loadPendingProducts() {
            const res = await fetch(`${API_BASE}/admin/products`);
            const products = await res.json();
            const pending = products.filter(p => p.status === 'pending');
            const list = document.getElementById('pending-products-list');
            
            if (pending.length === 0) {
                list.innerHTML = '<p class="text-center py-12 glass rounded-2xl text-gray-500 text-xs font-black uppercase tracking-widest">No pending products</p>';
                return;
            }

            list.innerHTML = pending.map(p => `
                <div class="glass p-6 rounded-2xl border border-white/5 flex items-center justify-between">
                    <div class="flex items-center gap-4">
                        <img src="${API_BASE.replace('/api', '')}${p.img}" class="w-16 h-16 rounded-xl object-cover">
                        <div>
                            <h4 class="font-black uppercase tracking-tighter">${p.name}</h4>
                            <p class="text-[10px] text-gray-500 uppercase tracking-widest">${p.architect} | $${p.price}</p>
                        </div>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="updateStatus('${p.id}', 'approved')" class="px-4 py-2 bg-green-500/10 text-green-400 border border-green-500/20 rounded-lg text-[9px] font-black uppercase tracking-widest hover:bg-green-500/20 transition-all">Approve</button>
                        <button onclick="updateStatus('${p.id}', 'rejected')" class="px-4 py-2 bg-red-500/10 text-red-400 border border-red-500/20 rounded-lg text-[9px] font-black uppercase tracking-widest hover:bg-red-500/20 transition-all">Reject</button>
                    </div>
                </div>
            `).join('');
        }

        async function updateStatus(id, status) {
            await fetch(`${API_BASE}/admin/products/${id}/status`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status })
            });
            loadPendingProducts();
        }

        // Simple auth check
        if (getCookie('userRole') !== 'admin') {
            alert('Access Denied');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
